<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مراقبة المسؤولين - وزارة الصحة</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .violation-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .violation-yes {
      background: rgba(231, 76, 60, 0.2);
      color: #e74c3c;
      border: 1px solid rgba(231, 76, 60, 0.3);
    }
    .violation-no {
      background: rgba(46, 204, 113, 0.2);
      color: #2ecc71;
      border: 1px solid rgba(46, 204, 113, 0.3);
    }
    .admin-stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
    }
    .admin-stat-card {
      background: rgba(30, 39, 94, 0.9);
      border-radius: 12px;
      padding: 18px;
      border: 1px solid rgba(212, 175, 55, 0.15);
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .admin-stat-card .stat-icon {
      width: 50px;
      height: 50px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
    }
    .admin-stat-card .stat-info h4 {
      margin: 0;
      font-weight: 800;
      font-size: 1.5rem;
    }
    .admin-stat-card .stat-info small {
      color: #a0aec0;
      font-size: 0.8rem;
    }
    .detail-chip {
      background: rgba(255,255,255,0.05);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      display: inline-block;
    }
    .refresh-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 15px;
    }
    .tab-bar {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }
    .tab-btn {
      padding: 7px 16px;
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 8px;
      background: transparent;
      color: #e2e8f0;
      cursor: pointer;
      font-family: 'Cairo', sans-serif;
      font-size: 0.82rem;
      font-weight: 600;
      transition: all 0.2s;
    }
    .tab-btn:hover, .tab-btn.active {
      background: #d4af37;
      color: #1a1a2e;
      border-color: #d4af37;
    }
    .log-list {
      max-height: 500px;
      overflow-y: auto;
    }
    .log-entry {
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 6px;
      background: rgba(255,255,255,0.02);
      border-right: 3px solid #d4af37;
      font-size: 0.85rem;
    }
    .log-entry .log-action { font-weight: 700; color: #d4af37; }
    .log-entry .log-time { color: #718096; font-size: 0.75rem; }
  </style>
</head>
<body>
  <div class="container mt-4">
    <div class="header-section">
      <div class="logo-container">
        <img src="https://cdn.discordapp.com/attachments/1420155092874563827/1507553405600661535/1e923720-aa14-4993cd7-afc6c88d4969.png?ex=6a125204&is=6a110084&hm=86cda9c46f44de6745ac6109edfb22e7b969ee215a109cfd07f336390267e815&" alt="وزارة الصحة" class="ministry-logo" onerror="this.style.display='none'">
      </div>
      <div class="title-container">
        <h1>
          <span class="title-highlight">مراقبة المسؤولين</span>
          <br>
          <span class="ministry-name">وزارة الصحة</span>
        </h1>
      </div>
      <div class="admin-controls">
        <button class="btn btn-outline-gold" onclick="toggleSubmissions()" id="toggleBtn">
          <i class="fas fa-toggle-on"></i> <span id="toggleLabel">...جاري</span>
        </button>
        <button class="btn btn-outline-gold" onclick="location.reload()">
          <i class="fas fa-sync"></i> تحديث
        </button>
      </div>
    </div>

    <div id="statsContainer" class="admin-stats-grid"></div>

    <div class="form-card" style="padding: 20px;">
      <div class="refresh-bar">
        <div class="tab-bar" id="filterTabs">
          <button class="tab-btn active" data-filter="all">الكل</button>
          <button class="tab-btn" data-filter="pending">قيد المراجعة</button>
          <button class="tab-btn" data-filter="approved">مقبول</button>
          <button class="tab-btn" data-filter="rejected">مرفوض</button>
        </div>
        <div>
          <input type="text" id="searchInput" class="form-control d-inline-block" style="width:200px;display:inline!important;" placeholder="🔍 بحث...">
        </div>
      </div>
      <div class="table-container" style="padding:0;border:none;">
        <div id="applicationsList"><div class="empty-state"><i class="fas fa-spinner fa-spin"></i><p>جاري التحميل...</p></div></div>
      </div>
    </div>

    <div class="form-card" style="padding:20px;margin-top:20px;">
      <h5 style="color:#d4af37;font-weight:700;margin-bottom:15px;"><i class="fas fa-history"></i> سجل الحركات</h5>
      <div id="logsList" class="log-list"><div class="empty-state"><i class="fas fa-spinner fa-spin"></i></div></div>
    </div>
  </div>

  <script>
    function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    let allApps = [];
    let currentFilter = 'all';

    let submissionsOpen = true;

    async function loadData() {
      const [appsRes, logsRes, statsRes, settingsRes] = await Promise.all([
        fetch('/api/applications'),
        fetch('/api/logs'),
        fetch('/api/stats'),
        fetch('/api/settings')
      ]);
      allApps = await appsRes.json();
      const logs = await logsRes.json();
      const stats = await statsRes.json();
      const settings = await settingsRes.json();
      submissionsOpen = settings.submissions_open;
      renderStats(stats);
      renderTable();
      renderLogs(logs);
      updateToggleBtn();
    }

    function updateToggleBtn() {
      const btn = document.getElementById('toggleBtn');
      const lbl = document.getElementById('toggleLabel');
      if (submissionsOpen) {
        btn.className = 'btn btn-outline-danger';
        lbl.innerHTML = '<i class="fas fa-lock-open"></i> إغلاق التقديم';
      } else {
        btn.className = 'btn btn-outline-success';
        lbl.innerHTML = '<i class="fas fa-lock"></i> فتح التقديم';
      }
    }

    async function toggleSubmissions() {
      const res = await fetch('/api/settings/toggle-submissions', { method: 'POST' });
      const data = await res.json();
      submissionsOpen = data.submissions_open;
      updateToggleBtn();
      alert(data.message);
      loadData();
    }

    function renderStats(stats) {
      const c = document.getElementById('statsContainer');
      c.innerHTML = `
        <div class="admin-stat-card">
          <div class="stat-icon" style="background:rgba(52,152,219,0.2);color:#3498db;"><i class="fas fa-file-medical"></i></div>
          <div class="stat-info"><h4 style="color:#3498db;">${stats.total}</h4><small>إجمالي الطلبات</small></div>
        </div>
        <div class="admin-stat-card">
          <div class="stat-icon" style="background:rgba(243,156,18,0.2);color:#f39c12;"><i class="fas fa-clock"></i></div>
          <div class="stat-info"><h4 style="color:#f39c12;">${stats.pending}</h4><small>قيد المراجعة</small></div>
        </div>
        <div class="admin-stat-card">
          <div class="stat-icon" style="background:rgba(46,204,113,0.2);color:#2ecc71;"><i class="fas fa-check-circle"></i></div>
          <div class="stat-info"><h4 style="color:#2ecc71;">${stats.approved}</h4><small>مقبول</small></div>
        </div>
        <div class="admin-stat-card">
          <div class="stat-icon" style="background:rgba(231,76,60,0.2);color:#e74c3c;"><i class="fas fa-times-circle"></i></div>
          <div class="stat-info"><h4 style="color:#e74c3c;">${stats.rejected}</h4><small>مرفوض</small></div>
        </div>
      `;
    }

    function renderTable() {
      const search = document.getElementById('searchInput').value.trim().toLowerCase();
      let filtered = allApps;
      if (currentFilter !== 'all') filtered = filtered.filter(a => a.status === currentFilter);
      if (search) filtered = filtered.filter(a =>
        a.full_name.toLowerCase().includes(search) ||
        String(a.age).includes(search) ||
        (a.reviewed_by && a.reviewed_by.toLowerCase().includes(search))
      );

      const c = document.getElementById('applicationsList');
      if (!filtered.length) {
        c.innerHTML = '<div class="empty-state"><i class="fas fa-inbox"></i><p>لا توجد طلبات</p></div>';
        return;
      }

      let html = '<div class="table-responsive"><table><thead><tr>' +
        '<th>#</th><th>الاسم</th><th>العمر</th><th>الحالة</th>' +
        '<th>المراجع</th><th>التزام المسؤول</th><th>التاريخ</th><th>حذف</th>' +
      '</tr></thead><tbody>';

      filtered.forEach((a, i) => {
        const stCls = 'status-' + a.status;
        const stTxt = a.status === 'pending' ? 'قيد المراجعة' : a.status === 'approved' ? '✅ مقبول' : '❌ مرفوض';

        const reviewer = a.reviewed_by || '-';
        let violation = '';
        if (a.status === 'rejected') {
          if (a.rejection_reason && a.rejection_reason.trim()) {
            violation = '<span class="violation-badge violation-no"><i class="fas fa-check"></i> مذكور</span>';
          } else {
            violation = '<span class="violation-badge violation-yes"><i class="fas fa-exclamation"></i> بدون سبب!</span>';
          }
        } else if (a.status === 'approved') {
          violation = '<span class="violation-badge violation-no"><i class="fas fa-check"></i> مقبول</span>';
        } else {
          violation = '<span style="color:#718096;font-size:0.8rem;">-</span>';
        }

        const date = new Date(a.created_at + 'Z').toLocaleDateString('ar-EG');

        html += '<tr>' +
          '<td>' + (i+1) + '</td>' +
          '<td><strong>' + escHtml(a.full_name) + '</strong></td>' +
          '<td>' + escHtml(String(a.age)) + '</td>' +
          '<td><span class="status-badge ' + stCls + '">' + stTxt + '</span></td>' +
          '<td style="color:#a0aec0;font-size:0.85rem;">' + escHtml(reviewer) + '</td>' +
          '<td>' + violation + '</td>' +
          '<td style="font-size:0.8rem;color:#718096;">' + date + '</td>' +
          '<td><button class="btn btn-danger btn-sm" onclick="deleteApp(\'' + a.id + '\')" style="padding:4px 10px;font-size:0.75rem;"><i class="fas fa-trash"></i></button></td>' +
        '</tr>';
      });

      html += '</tbody></table></div>';
      c.innerHTML = html;
    }

    function renderLogs(logs) {
      const c = document.getElementById('logsList');
      if (!logs.length) {
        c.innerHTML = '<div class="empty-state"><i class="fas fa-history"></i><p>لا توجد حركات</p></div>';
        return;
      }
      c.innerHTML = logs.slice(0, 50).map(l => {
        const icon = l.action === 'submit' ? '📋' : l.action === 'approve' ? '✅' : l.action === 'reject' ? '❌' : '🗑️';
        const time = new Date(l.created_at + 'Z').toLocaleString('ar-EG');
        return `<div class="log-entry">
          <div class="log-action">${icon} ${l.details}</div>
          <div class="log-time">${time}</div>
        </div>`;
      }).join('');
    }

    async function deleteApp(id) {
      if (!confirm('هل أنت متأكد من الحذف؟')) return;
      const res = await fetch('/api/applications/' + id, { method: 'DELETE' });
      const data = await res.json();
      alert(data.message);
      loadData();
    }

    document.getElementById('filterTabs').addEventListener('click', e => {
      const btn = e.target.closest('.tab-btn');
      if (!btn) return;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      renderTable();
    });

    document.getElementById('searchInput').addEventListener('input', renderTable);

    loadData();
    setInterval(loadData, 30000);
  </script>
</body>
</html>
